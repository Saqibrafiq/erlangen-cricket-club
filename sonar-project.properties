# SonarCloud (free for public repositories). The CI step runs once the SONAR_TOKEN secret exists.
sonar.organization=saqibrafiq
sonar.projectKey=Saqibrafiq_erlangen-cricket-club
sonar.projectName=Erlangen Cricket Club

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**/*.spec.ts
sonar.exclusions=src/payload-types.ts,src/cms/migrations/**,src/app/(payload)/**,**/*.stories.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Route pages and layouts only compose features (CLAUDE.md §4.2) and are covered by the Playwright
# E2E tests, which report no line coverage. The logic they call (features/, shared/, domain/) counts.
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx
