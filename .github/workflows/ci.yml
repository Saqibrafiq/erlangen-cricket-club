name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Points at the ephemeral Postgres service of the build-and-e2e job; other jobs never connect.
  DATABASE_URI: postgres://postgres:postgres@localhost:5432/ecc
  PAYLOAD_SECRET: ci-only-secret-not-used-in-any-deployment-000000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: '1'
  # Test admin, created by the seed in the throwaway CI database only (seed-e2e-user.ts).
  E2E_ADMIN_EMAIL: e2e-admin@example.com
  E2E_ADMIN_PASSWORD: ci-only-password-not-used-anywhere-else

jobs:
  quality:
    name: Lint, types, architecture, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build-and-e2e:
    name: Build, E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      # The runner image ships PostgreSQL: no container pull, so no Docker Hub or ECR pull limits
      # (both have failed CI before). Matches DATABASE_URI above.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ecc
          pg_isready -h localhost -p 5432
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Static pages read from the database at build time, so schema and data must exist first.
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet
